name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "enhancement/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  STEP_TIMING_ENABLED: "true"

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.3"

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --group dev

      - name: Run Ruff linter
        id: lint
        run: |
          echo "::group::Lint Results"
          uv run ruff check . || exit 1
          echo "::endgroup::"

      - name: Run Ruff formatter check
        id: format
        run: |
          echo "::group::Format Check"
          uv run ruff format --check . || exit 1
          echo "::endgroup::"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.3"

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --group dev

      - name: Run type checker
        id: typecheck
        run: |
          echo "::group::Type Check Results"
          uv run ty check proxywhirl/ || exit 1
          echo "::endgroup::"

  validate-commits:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Required for commit history

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.3"

      - name: Install commitizen
        run: uv tool install commitizen==4.13.10

      - name: Validate commit messages
        run: |
          # Check all commits in the PR
          cz check --rev-range origin/${{ github.base_ref }}..HEAD

  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN_PRESENT: ${{ secrets.CODECOV_TOKEN != '' }}
      HYPOTHESIS_PROFILE: ci
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.3"

      - name: Cache pytest
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .pytest_cache
            .coverage*
            htmlcov
          key: pytest-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.sha }}
          restore-keys: |
            pytest-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --group dev

      - name: Run non-slow tests
        id: test
        run: |
          echo "::group::Test Results"
          uv run pytest tests/ --ignore=tests/benchmarks -m "not slow and not stress and not network" --timeout=120 -v
          echo "::endgroup::"

      - name: Check coverage threshold
        if: matrix.python-version == '3.11'
        run: |
          echo "::group::Coverage Check"
          uv run pytest \
            tests/ \
            --ignore=tests/benchmarks \
            -m "not slow and not stress and not network" \
            --cov=proxywhirl.models \
            --cov=proxywhirl.strategies \
            --cov=proxywhirl.rotator \
            --cov=proxywhirl.storage \
            --cov=proxywhirl.utils \
            --cov=proxywhirl.fetchers \
            --cov=proxywhirl.sources \
            --cov=proxywhirl.exceptions \
            --cov=proxywhirl.api \
            --cov=proxywhirl.security \
            --cov=proxywhirl.mcp \
            --cov=proxywhirl.credentials_manager \
            --cov=proxywhirl.cache.crypto \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=json:coverage.json \
            --cov-fail-under=90 \
            --timeout=120 \
            -q \
            --tb=line || (echo "Code coverage is below 90% threshold" && exit 1)
          echo "::endgroup::"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        if: matrix.python-version == '3.11' && env.CODECOV_TOKEN_PRESENT == 'true'
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.python-version == '3.11'
        with:
          name: coverage-data
          path: coverage.json
          retention-days: 7

  test-all-extras:
    name: Test with all extras - Python 3.11
    runs-on: ubuntu-latest
    # Only run on PRs and main to avoid redundant test runs
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.3"

      - name: Cache pytest
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .pytest_cache
            .coverage*
            htmlcov
          key: pytest-extras-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            pytest-extras-${{ runner.os }}-

      - name: Install dependencies with all extras
        run: uv sync --locked --python 3.11 --extra all --group dev

      - name: Run tests
        run: uv run pytest tests/unit/ tests/integration/ tests/property/ tests/api/ tests/contract/ -m "not slow and not stress and not network" --timeout=120 -v

  benchmark:
    name: Benchmark Performance Regression
    runs-on: ubuntu-latest
    # Only run benchmarks on PRs and main, not feature branches
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Required to access baseline from git

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.3"

      - name: Cache benchmark results
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .benchmarks
          key: benchmarks-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            benchmarks-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --group dev

      - name: Run benchmarks with regression check
        id: benchmark
        run: |
          echo "::group::Benchmark Results"
          benchmark_args=(--benchmark-only)
          if [ -d .benchmarks ] && find .benchmarks -type f -name "*0001*.json" | grep -q .; then
            benchmark_args+=(--benchmark-compare=0001)
          else
            echo "No benchmark baseline matching 0001 found; recording results without comparison."
          fi
          # Non-blocking: records baselines without failing CI on first run or noisy benches.
          uv run pytest tests/benchmarks/ "${benchmark_args[@]}" || true
          echo "::endgroup::"

      - name: Parse benchmark results
        if: always()
        id: parse-benchmarks
        run: |
          uv run python -c "
          import json, os
          bench_files = [f for f in os.listdir('.benchmarks') if f.startswith('.benchmarksession') and f.endswith('.json')]
          if bench_files:
            with open(os.path.join('.benchmarks', sorted(bench_files)[-1])) as f:
              results = json.load(f)
              print('::group::Benchmark Summary')
              for bench in results.get('benchmarks', []):
                print(f\"  {bench['name']}: {bench['stats']['mean']:.6f}s\")
              print('::endgroup::')
          " || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-results
          path: |
            .benchmarks/
            benchmark-histogram*
          if-no-files-found: ignore

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.3"

      - name: Install build dependencies
        run: uv sync --locked --python 3.11

      - name: Build package
        run: uv build

      - name: Store distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.3"

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: uv sync --locked --python 3.11

      - name: Install web dependencies
        env:
          NODE_OPTIONS: --disable-warning=DEP0169
        run: pnpm --dir web install --frozen-lockfile

      - name: Generate documentation references
        run: pnpm --dir web run docs:generate

      - name: Verify generated docs are committed
        run: git diff --exit-code -- web/content/docs/generated web/content/docs/api/openapi web/content/generated web/public/llms.txt web/public/proxy-lists

      - name: Lint web documentation app
        run: pnpm --dir web run lint

      - name: Test web documentation app
        run: pnpm --dir web run test:run

      - name: Build documentation site
        run: pnpm --dir web run build

      - name: Install Playwright Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Run web e2e (CI)
        run: pnpm --dir web run test:e2e:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Report workflow timing
        if: always()
        run: |
          {
            echo "## CI Workflow Timing"
            echo ""
            echo "All jobs have completed. Check individual job logs for step-level timings."
          } >> "$GITHUB_STEP_SUMMARY"
