name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-character main SHA that already passed remote assurance'
        required: true
        type: string
      version:
        description: 'Exact normalized PEP 440 version already present in pyproject.toml'
        required: true
        type: string

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    environment: pypi
    # Required for trusted publishing (OIDC)
    permissions:
      actions: read
      id-token: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@1cce3390c2bfda521930d01229c073c7ff920824 # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@7390f777b051d6c47c9cb905ff80e7d5d85a7068 # v8.2.0
        with:
          version: "0.12.3"

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --group dev

      - name: Validate immutable release candidate
        id: release_metadata
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a lowercase 40-character commit SHA."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked-out commit does not match candidate_sha."
            exit 1
          fi
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$EXPECTED_SHA" ]; then
            echo "::error::candidate_sha is not the current origin/main head."
            exit 1
          fi

          uv run python - <<'PY'
          import os
          import sys
          import tomllib
          from pathlib import Path

          from packaging.version import InvalidVersion, Version


          def fail(message: str) -> None:
              print(f"::error::{message}", file=sys.stderr)
              raise SystemExit(1)


          def pep440_version(value: str, field: str) -> Version:
              if not value:
                  fail(f"{field} must not be empty.")
              try:
                  version = Version(value)
              except InvalidVersion:
                  fail(f"{field} must be a valid PEP 440 version.")
              normalized = str(version)
              if normalized != value:
                  fail(f"{field} must use normalized PEP 440 form: {normalized}")
              return version


          expected = pep440_version(os.environ["EXPECTED_VERSION"], "version")
          with Path("pyproject.toml").open("rb") as project_file:
              project = tomllib.load(project_file)
          actual = pep440_version(project["project"]["version"], "project.version")
          commitizen = pep440_version(project["tool"]["commitizen"]["version"], "commitizen.version")
          if actual != expected or commitizen != expected:
              fail(
                  "version input, project.version, and tool.commitizen.version must match "
                  f"exactly (input={expected}, project={actual}, commitizen={commitizen})."
              )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={expected}\n")
              output.write(f"prerelease={'true' if expected.is_prerelease else 'false'}\n")
          print(f"Validated release candidate v{expected}")
          PY

      - name: Require exact-SHA remote assurance
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          runs_file="$RUNNER_TEMP/exact-sha-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXPECTED_SHA&per_page=100" > "$runs_file"
          for workflow in "CI" "Security Scan" "Validate Proxy Sources"; do
            conclusion="$(jq -r --arg workflow "$workflow" '
              [.workflow_runs[] | select(.name == $workflow)]
              | sort_by(.run_number)
              | last
              | .conclusion // "missing"
            ' "$runs_file")"
            run_id="$(jq -r --arg workflow "$workflow" '
              [.workflow_runs[] | select(.name == $workflow)]
              | sort_by(.run_number)
              | last
              | .id // "missing"
            ' "$runs_file")"
            echo "$workflow: run=$run_id conclusion=$conclusion" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$conclusion" != "success" ]; then
              echo "::error::$workflow must have a latest successful run on $EXPECTED_SHA (got $conclusion)."
              exit 1
            fi
          done

      - name: Re-run non-slow candidate tests
        run: uv run pytest tests/ --ignore=tests/benchmarks -m "not slow and not stress and not network" --timeout=120 -q

      - name: Build package
        run: uv build

      - name: Check package
        run: uvx --from twine==6.2.0 twine check dist/*

      - name: Create or verify release tag
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            if [ "$(git rev-list -n 1 "v${VERSION}")" != "$CANDIDATE_SHA" ]; then
              echo "::error::Existing v${VERSION} tag does not point to candidate_sha."
              exit 1
            fi
            echo "Verified existing v${VERSION} tag at $CANDIDATE_SHA."
          else
            git tag -a "v${VERSION}" "$CANDIDATE_SHA" -m "Release v${VERSION}"
          fi

      - name: Push release tag
        env:
          VERSION: ${{ steps.release_metadata.outputs.version }}
        run: git push origin "refs/tags/v${VERSION}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        # Trusted publishing (OIDC): https://pypi.org/manage/project/proxywhirl/settings/publishing/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: v${{ steps.release_metadata.outputs.version }}
          name: Release v${{ steps.release_metadata.outputs.version }}
          body: |
            ## proxywhirl v${{ steps.release_metadata.outputs.version }}

            ### Changes
            See [CHANGELOG](https://github.com/wyattowalsh/proxywhirl/blob/main/docs/CHANGELOG.md) for details.

            ### Installation
            ```bash
            pip install proxywhirl==${{ steps.release_metadata.outputs.version }}
            ```
          draft: false
          prerelease: ${{ steps.release_metadata.outputs.prerelease }}
          files: |
            dist/*.whl
            dist/*.tar.gz
