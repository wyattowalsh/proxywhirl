apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxywhirl
  namespace: proxywhirl
  labels:
    app: proxywhirl
    version: v1
spec:
  # ReadWriteOnce PVC: run a single writer replica unless using shared storage (RWX/ object store).
  replicas: 1
  selector:
    matchLabels:
      app: proxywhirl
  # Avoid overlapping SQLite writers during rollout.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: proxywhirl
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/metrics"
    spec:
      serviceAccountName: proxywhirl
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: proxywhirl
        image: ghcr.io/wyattowalsh/proxywhirl:0.4.0rc1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP

        env:
        - name: PROXYWHIRL_LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: proxywhirl-config
              key: PROXYWHIRL_LOG_LEVEL
        - name: PROXYWHIRL_CACHE_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: proxywhirl-secrets
              key: cache-encryption-key
        - name: PROXYWHIRL_API_KEY
          valueFrom:
            secretKeyRef:
              name: proxywhirl-secrets
              key: api-key
        - name: PROXYWHIRL_REQUIRE_AUTH
          valueFrom:
            configMapKeyRef:
              name: proxywhirl-config
              key: PROXYWHIRL_REQUIRE_AUTH
        - name: PROXYWHIRL_PUBLIC_METRICS
          valueFrom:
            configMapKeyRef:
              name: proxywhirl-config
              key: PROXYWHIRL_PUBLIC_METRICS
        - name: PROXYWHIRL_BIND_HOST
          valueFrom:
            configMapKeyRef:
              name: proxywhirl-config
              key: PROXYWHIRL_BIND_HOST
        - name: PROXYWHIRL_STORAGE_PATH
          valueFrom:
            configMapKeyRef:
              name: proxywhirl-config
              key: PROXYWHIRL_STORAGE_PATH
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true

        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        livenessProbe:
          httpGet:
            path: /api/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: proxywhirl-data
      - name: tmp
        emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - proxywhirl
              topologyKey: kubernetes.io/hostname
