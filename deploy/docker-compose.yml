# Production-oriented stack. Copy deploy/.env.example to .env and set all required secrets.
# Required variables use ${VAR:?message} so compose fails fast on placeholder values.

services:
  redis:
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    container_name: proxywhirl-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxywhirl
    restart: unless-stopped

  proxywhirl:
    build:
      context: ..
      dockerfile: Dockerfile
    image: proxywhirl-api:0.4.0rc1
    container_name: proxywhirl-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PROXYWHIRL_LOG_LEVEL: INFO
      PROXYWHIRL_STORAGE_PATH: /data/proxywhirl.db
      PROXYWHIRL_CACHE_ENCRYPTION_KEY: ${PROXYWHIRL_CACHE_ENCRYPTION_KEY:?Set PROXYWHIRL_CACHE_ENCRYPTION_KEY in .env}
      PROXYWHIRL_REQUIRE_AUTH: "true"
      PROXYWHIRL_PUBLIC_METRICS: "false"
      PROXYWHIRL_BIND_HOST: "0.0.0.0"
      PROXYWHIRL_API_KEY: ${PROXYWHIRL_API_KEY:?Set PROXYWHIRL_API_KEY in .env}
      PROXYWHIRL_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./data:/data
      - proxywhirl-logs:/var/log/proxywhirl
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - proxywhirl
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    container_name: proxywhirl-prometheus
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - proxywhirl
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    container_name: proxywhirl-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/proxywhirl.yml:ro
      - ./monitoring/grafana-dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
    networks:
      - proxywhirl
    restart: unless-stopped

volumes:
  redis-data:
  proxywhirl-logs:
  prometheus-data:
  grafana-data:

networks:
  proxywhirl:
    driver: bridge
