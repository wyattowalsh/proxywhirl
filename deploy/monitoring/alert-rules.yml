# PromQL notes:
# - Use rate() on counters (e.g. proxywhirl_requests_total), not raw counters, for error ratios.
# - histogram_quantile() requires a rate() or increase() on the _bucket time series.
# - Metric names must match proxywhirl/metrics_collector.py exports.
groups:
  - name: proxywhirl
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(proxywhirl_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(proxywhirl_requests_total[5m])) > 0.05
        for: 5m
        annotations:
          summary: "High error rate detected"
          description: "Non-success request ratio is above 5%"

      - alert: LowProxyAvailability
        expr: proxywhirl_proxies_healthy < 100
        for: 5m
        annotations:
          summary: "Low proxy availability"
          description: "Only {{ $value }} active proxies in pool"

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(proxywhirl_request_duration_seconds_bucket[5m])) by (le)
          ) > 10
        for: 5m
        annotations:
          summary: "High request latency"
          description: "P95 latency is {{ $value }}s"
