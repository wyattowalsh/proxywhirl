# External Redis is optional and is not bundled as a subchart.
# ReadWriteOnce SQLite storage is intentionally single-replica.
replicaCount: 1

image:
  repository: ghcr.io/wyattowalsh/proxywhirl
  tag: "0.4.0rc1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

config:
  auth:
    requireAuth: true
    publicMetrics: false
  bindHost: "0.0.0.0"
  logging:
    level: INFO

secrets:
  create: false
  existingSecret: proxywhirl-secrets
  cacheEncryptionKey: ""
  apiKey: ""
  redisUrl: ""

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: api.proxywhirl.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: proxywhirl-tls
      hosts:
        - api.proxywhirl.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

redis:
  enabled: false
  existingSecret: proxywhirl-secrets

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAnnotations: {}
imagePullSecrets: []
affinity: {}

persistence:
  enabled: true
  mountPath: /data
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClassName: ""
