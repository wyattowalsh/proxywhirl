{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "ProxyWhirl supports exactly one application replica with its SQLite storage backend" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proxywhirl.fullname" . }}
  labels:
    {{- include "proxywhirl.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "proxywhirl.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "proxywhirl.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "proxywhirl.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        env:
        - name: PROXYWHIRL_LOG_LEVEL
          value: "{{ .Values.config.logging.level }}"
        - name: PROXYWHIRL_CACHE_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "proxywhirl.fullname" .)) }}
              key: cache-encryption-key
        - name: PROXYWHIRL_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "proxywhirl.fullname" .)) }}
              key: api-key
        - name: PROXYWHIRL_REQUIRE_AUTH
          value: "{{ .Values.config.auth.requireAuth }}"
        - name: PROXYWHIRL_PUBLIC_METRICS
          value: "{{ .Values.config.auth.publicMetrics }}"
        - name: PROXYWHIRL_BIND_HOST
          value: "{{ .Values.config.bindHost }}"
        - name: PROXYWHIRL_STORAGE_PATH
          value: "{{ .Values.persistence.mountPath }}/proxywhirl.db"
        {{- if .Values.redis.enabled }}
        - name: PROXYWHIRL_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.redis.existingSecret | default (.Values.secrets.existingSecret | default (printf "%s-secrets" (include "proxywhirl.fullname" .))) }}
              key: redis-url
        {{- end }}
        livenessProbe:
          httpGet:
            path: /api/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        - name: data
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
        - name: tmp
          mountPath: /tmp
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "proxywhirl.fullname" . }}-data
      {{- end }}
      - name: tmp
        emptyDir: {}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
