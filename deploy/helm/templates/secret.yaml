{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "proxywhirl.fullname" .)) }}
  labels:
    {{- include "proxywhirl.labels" . | nindent 4 }}
type: Opaque
stringData:
  cache-encryption-key: {{ required "Set secrets.cacheEncryptionKey or use secrets.existingSecret" .Values.secrets.cacheEncryptionKey | quote }}
  api-key: {{ required "Set secrets.apiKey or use secrets.existingSecret" .Values.secrets.apiKey | quote }}
  {{- if .Values.redis.enabled }}
  redis-url: {{ required "Set secrets.redisUrl (redis://:PASSWORD@host:port/db)" .Values.secrets.redisUrl | quote }}
  {{- end }}
{{- end }}
