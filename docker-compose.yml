# Local development stack. The API is published only on host loopback even though
# its container listener binds all interfaces. Do not expose this stack on an
# untrusted network without removing the explicit local override and enabling auth.
# Optional profiles: `monitoring` (prometheus+grafana), `tracing` (jaeger).

services:
  proxywhirl-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: proxywhirl-api:0.4.0rc1
    container_name: proxywhirl-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Core Configuration
      - PROXYWHIRL_STRATEGY=round-robin
      - PROXYWHIRL_TIMEOUT=30
      - PROXYWHIRL_MAX_RETRIES=3

      # Explicit local-only exception: the host port is pinned to 127.0.0.1 above.
      # Remove ALLOW_INSECURE_BIND and configure REQUIRE_AUTH + API_KEY before sharing.
      - PROXYWHIRL_REQUIRE_AUTH=${PROXYWHIRL_REQUIRE_AUTH:-false}
      - PROXYWHIRL_PUBLIC_METRICS=${PROXYWHIRL_PUBLIC_METRICS:-false}
      - PROXYWHIRL_BIND_HOST=0.0.0.0
      - PROXYWHIRL_ALLOW_INSECURE_BIND=1
      # - PROXYWHIRL_API_KEY=${PROXYWHIRL_API_KEY:?set when PROXYWHIRL_REQUIRE_AUTH=true}
      - PROXYWHIRL_CACHE_ENCRYPTION_KEY

      # CORS Configuration
      - PROXYWHIRL_CORS_ORIGINS=http://localhost:3000,http://localhost:8000

      # Database Storage
      - PROXYWHIRL_STORAGE_PATH=/data/proxywhirl.db

      # Redis Caching (must include password when redis --requirepass is set)
      - PROXYWHIRL_REDIS_URL=redis://:${REDIS_PASSWORD:-redis-dev-pass}@redis:6379/0

      # Logging
      - PROXYWHIRL_LOG_LEVEL=INFO

      # Rate Limiting
      - PROXYWHIRL_RATE_LIMIT_ENABLED=true
      - PROXYWHIRL_RATE_LIMIT_REQUESTS=100
      - PROXYWHIRL_RATE_LIMIT_PERIOD=60

    volumes:
      # Persistent storage for proxy pool (SQLite)
      - proxywhirl-data:/data

      # Development: Mount source code for live reloading (uncomment for dev mode)
      # - ./proxywhirl:/app/proxywhirl:ro

      # Optional: Mount custom configuration
      # - ./config:/app/config:ro

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

    networks:
      - proxywhirl-network

    depends_on:
      redis:
        condition: service_healthy

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis cache for proxy rotation state and caching
  redis:
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    container_name: proxywhirl-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis-dev-pass}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-pass}
    networks:
      - proxywhirl-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis-dev-pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Prometheus metrics collection
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
    container_name: proxywhirl-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./examples/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - proxywhirl-network
    depends_on:
      - proxywhirl-api
    restart: unless-stopped

  # Grafana dashboards for visualization
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
    container_name: proxywhirl-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - proxywhirl-network
    restart: unless-stopped

  # Jaeger distributed tracing
  jaeger:
    profiles: ["tracing"]
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    container_name: proxywhirl-jaeger
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:4317:4317"    # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"    # OTLP HTTP receiver
      - "127.0.0.1:6831:6831/udp"  # Jaeger agent
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    volumes:
      - jaeger-data:/badger/data
    networks:
      - proxywhirl-network
    restart: unless-stopped

volumes:
  proxywhirl-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  jaeger-data:
    driver: local

networks:
  proxywhirl-network:
    driver: bridge
