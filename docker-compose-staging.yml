# Staging stack for the supported ProxyWhirl API runtime.
# Required values fail closed; provide them through the shell or an explicit env file.

services:
  proxywhirl-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: proxywhirl-api:0.4.0rc1
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PROXYWHIRL_BIND_HOST: "0.0.0.0"
      PROXYWHIRL_REQUIRE_AUTH: "true"
      PROXYWHIRL_PUBLIC_METRICS: "false"
      PROXYWHIRL_API_KEY: ${PROXYWHIRL_API_KEY:?Set PROXYWHIRL_API_KEY}
      PROXYWHIRL_CACHE_ENCRYPTION_KEY: ${PROXYWHIRL_CACHE_ENCRYPTION_KEY:?Set PROXYWHIRL_CACHE_ENCRYPTION_KEY}
      PROXYWHIRL_STORAGE_PATH: /data/proxywhirl.db
      PROXYWHIRL_LOG_LEVEL: INFO
    volumes:
      - proxywhirl-staging-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  proxywhirl-staging-data:
